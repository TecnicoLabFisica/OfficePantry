<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggestions — Office Pantry</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<a class="backlink" href="index.html">‹ Office Pantry</a>

<header class="masthead">
  <h1>💡 Suggest something</h1>
  <p class="period" data-period></p>
</header>

<button class="pill" type="button" popovertarget="suggestions-sheet">
  📋 See what's already suggested
</button>

<section class="form-card" id="form" data-form>
  <p class="state">Loading the form…</p>
</section>

<aside class="sheet" id="suggestions-sheet" popover aria-labelledby="sheet-title">
  <div class="sheet-grabber" aria-hidden="true"></div>
  <header class="sheet-head">
    <h2 id="sheet-title">Already suggested</h2>
    <button class="sheet-close" type="button"
            popovertarget="suggestions-sheet" popovertargetaction="hide">Done</button>
  </header>
  <div class="panel" id="list" data-suggestions>
    <p class="state">Loading…</p>
  </div>
</aside>

<p class="footnote">No login needed. Suggestions are reviewed when the next shop happens.</p>

<script src="assets/pantry.js"></script>
<script>Pantry.initSuggestions();</script>
</body>
</html>
