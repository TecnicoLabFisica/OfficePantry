# The site itself is plain HTML/CSS/JS and needs nothing installed to run.
# This environment is only for the helper scripts and the ledger tests.

name: office-pantry

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # Development
  - git
  - ipython
  - pytest
  - pytest-cov

  # Code quality
  - ruff

  - pip:
      # QR sticker generation (tools/make_qr.py)
      - "qrcode[pil]"

      # Runs assets/pantry.js so the money maths can be tested (tests/)
      - quickjs
